[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dta-autolive"
version = "2.4.0"
description = "DTA AutoLive - Professional Live Automation Studio by DTA Studio"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Duc Truong AI - DTA Studio", email = "ductruong.onl@gmail.com" }
]
keywords = ["live-stream", "automation", "virtual-camera", "ffmpeg", "pyside6", "tiktok"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Video :: Display",
]

dependencies = [
    "PySide6>=6.6.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "websockets>=12.0",
    "structlog>=24.1.0",
    "cryptography>=42.0.0",
    "psutil>=5.9.0",
    "imageio-ffmpeg>=0.4.9",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "requests>=2.31.0",
    "pyautogui>=0.9.54",
    "pillow>=10.0.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "types-psutil",
    "types-requests",
]

[project.scripts]
dta-autolive = "dta_autolive.launcher.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I", "N", "UP", "ASYNC", "S", "B", "A", "COM", "C4", "DTZ", "T10", "EM", "FA", "ISC", "ICN", "G", "INP", "PIE", "T20", "PT", "Q", "RET", "SLF", "SLOT", "SIM", "TID", "TCH", "ARG", "PTH", "TD", "FIX", "ERA", "PD", "PGH", "PL", "TRY", "FLY", "NPY", "AIR", "PERF", "FURB", "LOG"]
ignore = ["S101", "G004", "T201", "INP001", "PTH110", "PTH107", "PTH118", "PTH123", "PLR2004", "E501", "ARG001", "ARG002", "ARG003", "PLR1714", "TRY003", "TRY300", "TRY400", "EM101", "EM102", "UP042", "C901", "PERF401", "S105", "S106", "S107", "S602", "S603", "S607", "S310", "PLW1510", "PLR0915", "PLR0912", "S110", "COM812", "PLR0913", "PLR0917", "N802"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "INP001", "PLR2004", "E501", "ARG001", "ARG002"]
"src/dta_autolive/infrastructure/ai_responder.py" = ["ALL"]
"src/dta_autolive/infrastructure/product_pinner.py" = ["ALL"]
"src/dta_autolive/infrastructure/solver.py" = ["ALL"]
"src/dta_autolive/infrastructure/capture.py" = ["ALL"]
"src/dta_autolive/infrastructure/mouse_automation.py" = ["ALL"]
"src/dta_autolive/infrastructure/trajectory.py" = ["ALL"]
"src/dta_autolive/infrastructure/deepseek_engine.py" = ["ALL"]
"src/dta_autolive/infrastructure/dta_qwen_engine.py" = ["ALL"]
"src/dta_autolive/infrastructure/tiktok_cart_scraper.py" = ["ALL"]
"src/dta_autolive/infrastructure/satellite_seeding_manager.py" = ["ALL"]
"src/dta_autolive/infrastructure/host_live_chat_responder.py" = ["ALL"]
"src/dta_autolive/infrastructure/tiktok_shop_knowledge_base.py" = ["ALL"]
"src/dta_autolive/infrastructure/domain_knowledge_adapter.py" = ["ALL"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = [
    "dta_autolive.infrastructure.ai_responder",
    "dta_autolive.infrastructure.product_pinner",
    "dta_autolive.infrastructure.solver",
    "dta_autolive.infrastructure.capture",
    "dta_autolive.infrastructure.mouse_automation",
    "dta_autolive.infrastructure.trajectory",
    "dta_autolive.infrastructure.deepseek_engine",
    "dta_autolive.infrastructure.dta_qwen_engine",
    "dta_autolive.infrastructure.tiktok_cart_scraper",
    "dta_autolive.infrastructure.satellite_seeding_manager",
    "dta_autolive.infrastructure.host_live_chat_responder",
    "dta_autolive.infrastructure.tiktok_shop_knowledge_base",
    "dta_autolive.infrastructure.domain_knowledge_adapter",
    "playwright.*",
]
ignore_errors = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
